name: Approval Sync to HuggingFace

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      sync_all:
        description: 'Sync all model_cards parquet files to HuggingFace'
        required: false
        default: 'true'

jobs:
  # Manual sync job - can be triggered from Actions tab
  manual-sync:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas pyarrow datasets huggingface_hub

      - name: Find parquet files
        id: find-parquet
        run: |
          FILES=$(find model_cards -name "*.parquet" 2>/dev/null | tr '\n' ' ' || echo "")
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Found parquet files: $FILES"

      - name: Sync to HuggingFace
        if: steps.find-parquet.outputs.files != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python .github/scripts/sync_to_huggingface.py \
            --files "${{ steps.find-parquet.outputs.files }}"

      - name: Calculate and update average scores
        if: steps.find-parquet.outputs.files != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python .github/scripts/calculate_avg_score.py

      - name: Trigger ot_hub deployment
        if: steps.find-parquet.outputs.files != ''
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.OT_HUB_DISPATCH_TOKEN }}
          repository: gsma-research/ot_hub
          event-type: leaderboard-updated
          client-payload: '{"trigger": "manual-sync"}'

  # PR-based approval sync
  handle-approval:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') ||
      (github.event_name == 'pull_request' && github.event.label.name == 'approve')
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas pyarrow datasets huggingface_hub

      - name: Find parquet files
        id: find-parquet
        run: |
          FILES=$(find model_cards -name "*.parquet" 2>/dev/null | tr '\n' ' ' || echo "")
          echo "files=$FILES" >> $GITHUB_OUTPUT
          if [ -n "$FILES" ]; then
            echo "Found parquet files: $FILES"
          else
            echo "No parquet files found"
          fi

      - name: Sync to HuggingFace
        if: steps.find-parquet.outputs.files != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python .github/scripts/sync_to_huggingface.py \
            --files "${{ steps.find-parquet.outputs.files }}"

      - name: Post sync report
        if: steps.find-parquet.outputs.files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request.number;

            let report;
            try {
              report = JSON.parse(fs.readFileSync('sync_report.json', 'utf8'));
            } catch (e) {
              report = {};
            }

            let body = '### Sync Report\n\n';

            if (report.new_models && report.new_models.length > 0) {
              body += '**New models added:**\n';
              for (const model of report.new_models) {
                body += `- ${model}\n`;
              }
              body += '\n';
            }

            if (report.updated_models && report.updated_models.length > 0) {
              body += '**Models updated:**\n';
              for (const model of report.updated_models) {
                body += `- ${model}\n`;
              }
              body += '\n';
            }

            if (report.updated_scores && report.updated_scores.length > 0) {
              body += '**Scores updated:**\n';
              for (const score of report.updated_scores) {
                body += `- ${score}\n`;
              }
              body += '\n';
            }

            if (report.preserved_scores && report.preserved_scores.length > 0) {
              body += '**Existing scores preserved:**\n';
              for (const score of report.preserved_scores) {
                body += `- ${score}\n`;
              }
            }

            // Only post if there's something to report
            if (body !== '### Sync Report\n\n') {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Calculate and update average scores
        if: steps.find-parquet.outputs.files != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python .github/scripts/calculate_avg_score.py

      - name: Close PR after successful sync
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;

            // Add approved and synced labels
            await github.rest.issues.addLabels({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['approved', 'synced-to-hf']
            });

            // Remove other status labels
            const labelsToRemove = ['ready-for-review', 'needs-work', 'approve'];
            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  issue_number: prNumber,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label
                });
              } catch (e) {
                // Label may not exist, ignore
              }
            }

            // Post success comment before closing
            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `:rocket: **Submission synced to HuggingFace!**\n\nYour evaluation has been synced to [GSMA/leaderboard](https://huggingface.co/datasets/GSMA/leaderboard) on HuggingFace.\n\nClosing this PR — the source of truth is the HF dataset.\n\nThank you for your contribution!`
            });

            // Close PR (don't merge — HF dataset is the source of truth)
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              state: 'closed'
            });

      - name: Trigger ot_hub deployment
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.OT_HUB_DISPATCH_TOKEN }}
          repository: gsma-research/ot_hub
          event-type: leaderboard-updated
          client-payload: '{"pr_number": "${{ github.event.pull_request.number }}"}'

  handle-changes-requested:
    runs-on: ubuntu-latest
    if: github.event.review.state == 'changes_requested'
    permissions:
      pull-requests: write

    steps:
      - name: Add needs-work label
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;

            // Add needs-work label
            await github.rest.issues.addLabels({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['needs-work']
            });

            // Remove ready-for-review label if present
            try {
              await github.rest.issues.removeLabel({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'ready-for-review'
              });
            } catch (e) {
              // Label may not exist, ignore
            }
