name: Sync to HuggingFace

on:
  push:
    branches:
      - main
    paths:
      - 'model_cards/**'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas pyarrow huggingface_hub datasets

      - name: Get changed parquet files
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'model_cards/*.parquet' | tr '\n' ' ')
          echo "files=$CHANGED" >> $GITHUB_OUTPUT

      - name: Sync to HuggingFace
        if: steps.changed.outputs.files != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python .github/scripts/sync_to_huggingface.py \
            --files "${{ steps.changed.outputs.files }}"

      - name: Post sync notification
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commits } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            });

            if (commits.length > 0) {
              const pr = commits[0];
              await github.rest.issues.createComment({
                issue_number: pr.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: ':rocket: Successfully synced to [GSMA/leaderboard](https://huggingface.co/datasets/GSMA/leaderboard) on HuggingFace!'
              });
            }
